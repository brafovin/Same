<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Der blonde Lehrer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
    #wrap { position: relative; }
    canvas { border: 3px solid #e94560; border-radius: 8px; display: block; background:#000; }
    #buttons { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
    .btn {
      background: #e94560; color: white; border: none; padding: 12px 32px;
      font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 0 #a82a40; transition: transform .08s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a82a40; }
    .btn.yes { background:#27ae60; box-shadow:0 4px 0 #1c7a44; }
    .btn.no  { background:#c0392b; box-shadow:0 4px 0 #8a281d; }
    #hint { color:#ffd700; margin-top:14px; font-size:15px; }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="550"></canvas>
  <div id="buttons"></div>
</div>
<div id="hint">Klicke / Leertaste = weiter</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const btnBox = document.getElementById('buttons');
const hint = document.getElementById('hint');

let t = 0;          // global animation time
let teacherMood = 'happy';  // happy | asking | nervous | panic | relief
let shake = 0;

// ── DIALOG SCRIPT ──────────────────────────────────────────
// type: 'say' (someone talks) or 'choice' (player picks)
const SCRIPT = [
  { who: 'Lehrer Herr Blondi', text: 'Guten Morgen Klasse! Heute lernen wir Mathe. 2 + 2 = ... ?', mood: 'happy' },
  { who: 'Die Klasse',         text: 'Vier!', mood: 'happy' },
  { who: 'Lehrer Herr Blondi', text: 'Sehr gut! Ihr seid heute richtig schlau.', mood: 'happy' },
  { who: 'Lehrer Herr Blondi', text: 'Ähm... Kinder, ich geh mal kurz auf Klo, ja?', mood: 'asking' },
  { who: '', text: '', mood: 'asking', choice: true },   // player chooses
  // branch handled in code
];

let idx = 0;
let phase = 'intro';   // intro -> choice -> ending
let ending = null;     // 'classroom' | 'allowed'
let endLines = [];
let endIdx = 0;

const current = () => SCRIPT[idx];

// ── INPUT ──────────────────────────────────────────────────
function advance() {
  if (phase === 'choice') return;        // must use the buttons
  if (phase === 'ending') {
    endIdx++;
    if (endIdx >= endLines.length) { restart(); return; }
    teacherMood = endLines[endIdx].mood;
    if (endLines[endIdx].mood === 'panic') shake = 16;
    return;
  }
  // intro lines
  idx++;
  if (idx >= SCRIPT.length) return;
  const c = current();
  teacherMood = c.mood;
  if (c.choice) { phase = 'choice'; showChoiceButtons(); }
}

canvas.addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
});

function showChoiceButtons() {
  btnBox.innerHTML = '';
  const yes = document.createElement('button');
  yes.className = 'btn yes'; yes.textContent = 'Ja, geh ruhig 🚽';
  yes.onclick = () => chooseYes();
  const no = document.createElement('button');
  no.className = 'btn no'; no.textContent = 'NEIN! ✋';
  no.onclick = () => chooseNo();
  btnBox.appendChild(no);
  btnBox.appendChild(yes);
  hint.textContent = 'Darf der Lehrer aufs Klo? Entscheide!';
}

function clearButtons() { btnBox.innerHTML = ''; hint.textContent = 'Klicke / Leertaste = weiter'; }

// ── ENDINGS ────────────────────────────────────────────────
function chooseYes() {
  clearButtons();
  ending = 'allowed';
  phase = 'ending';
  endLines = [
    { who: 'Die Klasse', text: 'Ja, gehen Sie ruhig!', mood: 'happy' },
    { who: 'Lehrer Herr Blondi', text: 'Puh, danke! Bin gleich wieder da. 🏃', mood: 'relief' },
    { who: '', text: 'ENDE — Der Lehrer ist gerettet! Klick für nochmal.', mood: 'relief' },
  ];
  endIdx = 0;
  teacherMood = 'relief';
}

function chooseNo() {
  clearButtons();
  ending = 'classroom';
  phase = 'ending';
  endLines = [
    { who: 'Die Klasse', text: 'NEIN! Sie bleiben hier!', mood: 'asking' },
    { who: 'Lehrer Herr Blondi', text: 'Was?! Aber ich muss doch ganz dringend...', mood: 'nervous' },
    { who: 'Die Klasse', text: 'NEIN heißt NEIN, Herr Blondi!', mood: 'nervous' },
    { who: 'Lehrer Herr Blondi', text: 'Okay... dann mach ich eben HIER in den Klassenraum! 😳', mood: 'panic' },
    { who: 'Lehrer Herr Blondi', text: '...und dann kackt er mitten in den Klassenraum! 💩', mood: 'panic' },
    { who: 'Die Klasse', text: 'IIIIH! NEEEIN! Das stinkt ja! 🤢', mood: 'panic' },
    { who: '', text: 'ENDE — Das hättet ihr ihn mal aufs Klo gehen lassen sollen! Klick für nochmal.', mood: 'panic' },
  ];
  endIdx = 0;
  teacherMood = 'asking';
}

function restart() {
  idx = 0; phase = 'intro'; ending = null; endLines = []; endIdx = 0;
  teacherMood = 'happy'; shake = 0;
  clearButtons();
}

// ── DRAW ───────────────────────────────────────────────────
function draw() {
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake -= 0.5; }

  drawClassroom();
  drawStudents();
  drawTeacher(220, 250, teacherMood);

  // floor puddle in the bad ending
  if (ending === 'classroom' && endIdx >= 3) {
    drawPuddle(220, 470);
  }
  // ...and then he poops — a poop pile appears
  if (ending === 'classroom' && endIdx >= 4) {
    drawPoop(235, 478);
    // stink lines
    ctx.strokeStyle = 'rgba(120,180,80,0.6)'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const sx = 215 + i * 20;
      ctx.beginPath();
      ctx.moveTo(sx, 455);
      ctx.quadraticCurveTo(sx + 6, 445 + Math.sin(t*0.01+i)*3, sx, 435);
      ctx.quadraticCurveTo(sx - 6, 425 + Math.cos(t*0.01+i)*3, sx, 415);
      ctx.stroke();
    }
  }

  drawDialog();
  ctx.restore();
}

function drawClassroom() {
  // Back wall
  ctx.fillStyle = '#e8e2d0'; ctx.fillRect(0, 0, canvas.width, 410);
  // Floor
  const fl = ctx.createLinearGradient(0, 410, 0, 550);
  fl.addColorStop(0, '#b9895c'); fl.addColorStop(1, '#9c6f44');
  ctx.fillStyle = fl; ctx.fillRect(0, 410, canvas.width, 140);
  // Floor boards
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2;
  for (let i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(i*120, 410); ctx.lineTo(i*120, 550); ctx.stroke(); }

  // Chalkboard
  ctx.fillStyle = '#2c4a3a'; ctx.fillRect(60, 40, 360, 150);
  ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 8; ctx.strokeRect(60, 40, 360, 150);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '26px Comic Sans MS, cursive';
  ctx.textAlign = 'left';
  ctx.fillText('2 + 2 = 4', 110, 110);
  ctx.font = '18px Comic Sans MS, cursive';
  ctx.fillText('Mathe heute :)', 110, 150);

  // Window
  ctx.fillStyle = '#aee3ff'; ctx.fillRect(560, 50, 260, 150);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeRect(560, 50, 260, 150);
  ctx.beginPath(); ctx.moveTo(690, 50); ctx.lineTo(690, 200);
  ctx.moveTo(560, 125); ctx.lineTo(820, 125); ctx.stroke();
  // sun in window
  ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(620, 95, 22, 0, Math.PI*2); ctx.fill();
  // clock
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(490, 70, 24, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(490,70); ctx.lineTo(490,54); ctx.moveTo(490,70); ctx.lineTo(503,70); ctx.stroke();
}

function drawStudents() {
  const colors = ['#e74c3c','#3498db','#9b59b6','#16a085','#e67e22','#2ecc71'];
  const positions = [
    {x:520,y:430},{x:640,y:430},{x:760,y:430},
    {x:560,y:500},{x:700,y:500}
  ];
  positions.forEach((p,i) => drawStudent(p.x, p.y, colors[i % colors.length], i));
}

function drawStudent(x, y, color, seed) {
  // desk
  ctx.fillStyle = '#caa472'; ctx.fillRect(x-32, y+30, 64, 12);
  ctx.fillStyle = '#a8855a'; ctx.fillRect(x-28, y+42, 8, 20); ctx.fillRect(x+20, y+42, 8, 20);
  // body
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x-16,y+30); ctx.lineTo(x+16,y+30); ctx.lineTo(x+12,y+2); ctx.lineTo(x-12,y+2); ctx.closePath(); ctx.fill();
  // head
  ctx.fillStyle = '#f5cba7'; ctx.beginPath(); ctx.arc(x, y-12, 14, 0, Math.PI*2); ctx.fill();
  // hair (varied)
  const hairs = ['#3b2a1a','#1a1a1a','#6b4423','#2c2c2c'];
  ctx.fillStyle = hairs[seed % hairs.length];
  ctx.beginPath(); ctx.arc(x, y-16, 14, Math.PI, 0); ctx.fill();
  ctx.fillRect(x-14, y-16, 28, 5);
  // eyes
  ctx.fillStyle = '#2c2c2c';
  ctx.beginPath(); ctx.arc(x-5, y-12, 2, 0, Math.PI*2); ctx.arc(x+5, y-12, 2, 0, Math.PI*2); ctx.fill();
  // mouth depends on mood during panic ending
  ctx.strokeStyle = '#a0392b'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (ending === 'classroom' && endIdx >= 4) {
    ctx.arc(x, y-2, 5, Math.PI, 0); // shocked frown
  } else {
    ctx.arc(x, y-6, 5, 0.1, Math.PI-0.1); // smile
  }
  ctx.stroke();
}

function drawTeacher(x, y, mood) {
  // wobble when nervous/panic
  const wob = (mood === 'nervous' || mood === 'panic') ? Math.sin(t*0.02)*4 : 0;
  ctx.save();
  ctx.translate(x + wob, y);

  // legs (crossed/squeezed when needing toilet)
  ctx.fillStyle = '#34495e';
  if (mood === 'nervous' || mood === 'panic') {
    ctx.fillRect(-14, 90, 12, 60); ctx.fillRect(2, 90, 12, 60);
  } else {
    ctx.fillRect(-16, 90, 13, 60); ctx.fillRect(3, 90, 13, 60);
  }
  // shoes
  ctx.fillStyle = '#222'; ctx.fillRect(-18, 148, 18, 8); ctx.fillRect(2, 148, 18, 8);

  // body (shirt + tie)
  ctx.fillStyle = '#ecf0f1';
  ctx.beginPath();
  ctx.moveTo(-26, 90); ctx.lineTo(26, 90); ctx.lineTo(20, 18); ctx.lineTo(-20, 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c0392b'; // tie
  ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(-6,30); ctx.lineTo(0,80); ctx.lineTo(6,30); ctx.closePath(); ctx.fill();

  // arms
  ctx.fillStyle = '#ecf0f1';
  if (mood === 'panic') {
    // hands clutching front
    ctx.fillRect(-30, 30, 10, 40); ctx.fillRect(20, 30, 10, 40);
  } else if (mood === 'asking') {
    ctx.fillRect(-34, 26, 10, 36); ctx.fillRect(24, 30, 10, 34);
  } else {
    ctx.fillRect(-32, 28, 10, 42); ctx.fillRect(22, 28, 10, 42);
  }

  // head
  ctx.fillStyle = '#f5cba7'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();

  // BLOND hair
  ctx.fillStyle = '#f4d03f';
  ctx.beginPath(); ctx.arc(0, -4, 20, Math.PI, 0); ctx.fill();
  ctx.fillRect(-20, -4, 40, 7);
  // little hair tuft
  ctx.beginPath(); ctx.arc(-8, -18, 6, 0, Math.PI*2); ctx.arc(4, -20, 7, 0, Math.PI*2); ctx.fill();

  // eyes by mood
  ctx.fillStyle = '#2c2c2c';
  if (mood === 'panic' || mood === 'nervous') {
    // wide worried eyes
    ctx.beginPath(); ctx.arc(-7, 0, 4, 0, Math.PI*2); ctx.arc(8, 0, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6, -1, 1.5, 0, Math.PI*2); ctx.arc(9, -1, 1.5, 0, Math.PI*2); ctx.fill();
    // sweat drop
    ctx.fillStyle = '#5dade2';
    ctx.beginPath(); ctx.arc(16, -2, 3, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(-7, 0, 2.5, 0, Math.PI*2); ctx.arc(8, 0, 2.5, 0, Math.PI*2); ctx.fill();
  }

  // eyebrows
  ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2;
  if (mood === 'asking') {
    ctx.beginPath(); ctx.moveTo(-12,-8); ctx.lineTo(-3,-6); ctx.moveTo(3,-6); ctx.lineTo(12,-8); ctx.stroke();
  }

  // mouth by mood
  ctx.strokeStyle = '#a0392b'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (mood === 'happy' || mood === 'relief') ctx.arc(0, 6, 8, 0.1, Math.PI-0.1);
  else if (mood === 'asking') ctx.arc(0, 10, 4, 0, Math.PI*2);
  else if (mood === 'nervous') { ctx.moveTo(-7, 9); ctx.lineTo(7, 11); }
  else if (mood === 'panic') ctx.arc(0, 11, 6, Math.PI, 0); // open worried
  ctx.stroke();

  ctx.restore();
}

function drawPuddle(x, y) {
  ctx.fillStyle = 'rgba(120,190,240,0.55)';
  ctx.beginPath();
  ctx.ellipse(x, y, 50, 14, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(120,190,240,0.35)';
  ctx.beginPath(); ctx.ellipse(x+30, y+6, 20, 7, 0, 0, Math.PI*2); ctx.fill();
}

// Cartoon poop pile (three stacked swirls)
function drawPoop(x, y) {
  ctx.fillStyle = '#7a4a1e';
  // bottom layer
  ctx.beginPath(); ctx.ellipse(x, y, 26, 11, 0, 0, Math.PI*2); ctx.fill();
  // middle blob
  ctx.fillStyle = '#8a5524';
  ctx.beginPath(); ctx.ellipse(x, y-9, 18, 10, 0, 0, Math.PI*2); ctx.fill();
  // top blob
  ctx.fillStyle = '#965e2a';
  ctx.beginPath(); ctx.ellipse(x, y-18, 11, 8, 0, 0, Math.PI*2); ctx.fill();
  // tip
  ctx.beginPath(); ctx.moveTo(x-5, y-22); ctx.quadraticCurveTo(x, y-34, x+5, y-22); ctx.fill();
  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(x-6, y-12, 4, 6, -0.4, 0, Math.PI*2); ctx.fill();
  // cartoon eyes on the poop :)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x-5, y-18, 3.2, 0, Math.PI*2); ctx.arc(x+5, y-18, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x-5, y-18, 1.5, 0, Math.PI*2); ctx.arc(x+5, y-18, 1.5, 0, Math.PI*2); ctx.fill();
}

function drawDialog() {
  let who = '', text = '';
  if (phase === 'intro' || phase === 'choice') {
    const c = current(); who = c.who; text = c.text;
    if (c.choice) { who = 'Lehrer Herr Blondi'; text = 'Also... darf ich jetzt aufs Klo? 🥺'; }
  } else if (phase === 'ending') {
    const c = endLines[endIdx]; who = c.who; text = c.text;
  }
  if (!text) return;

  // box
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  roundRect(ctx, 30, 360, 540, 150, 14); ctx.fill();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
  roundRect(ctx, 30, 360, 540, 150, 14); ctx.stroke();

  if (who) {
    ctx.fillStyle = who.includes('Lehrer') ? '#f4d03f' : '#5dade2';
    ctx.font = 'bold 20px Segoe UI'; ctx.textAlign = 'left';
    ctx.fillText(who, 52, 392);
  }
  ctx.fillStyle = '#fff'; ctx.font = '21px Segoe UI';
  wrapText(text, 52, 426, 500, 28);

  // blinking continue arrow (not during choice)
  if (phase !== 'choice' && Math.floor(t/400)%2===0) {
    ctx.fillStyle = '#ffd700'; ctx.font = '20px Segoe UI';
    ctx.fillText('▼', 540, 498);
  }
}

function wrapText(text, x, y, maxW, lh) {
  const words = text.split(' '); let line = ''; let yy = y;
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w + ' '; yy += lh; }
    else line = test;
  }
  ctx.fillText(line, x, yy);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ── LOOP ───────────────────────────────────────────────────
function loop(ts) { t = ts; draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
