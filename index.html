<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badewannen-Flug nach Indien</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
    canvas { border: 3px solid #e94560; border-radius: 8px; display: block; }
    #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 18px; text-align: center; pointer-events: none; }
    #hint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #ffd700; font-size: 16px; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; pointer-events: none; }
  </style>
</head>
<body>
<canvas id="game" width="900" height="550"></canvas>
<div id="hint"></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

// ── STATE MACHINE ──────────────────────────────────────────
// 'start' → 'home' → 'flying' → 'india' → 'start'
let state = 'start';

// ── PLAYER ─────────────────────────────────────────────────
const player = {
  x: 200, y: 370, w: 36, h: 54,
  vx: 0, vy: 0,
  onGround: true, dir: 1,
  frame: 0, frameTimer: 0
};

// ── WORLD ──────────────────────────────────────────────────
const GROUND = 430;

// Bathtub
const tub = { x: 340, y: 390, w: 90, h: 50 };

// Button (on the tub)
const btn = { x: tub.x + 30, y: tub.y - 14, w: 30, h: 14, pressed: false };

// ── FLYING (player-controlled, ~60 seconds) ────────────────
let flyProgress = 0;            // 0 → 1
let flyTubX = 0, flyTubY = 0;   // tub position (player steers)
let flyTubVX = 0, flyTubVY = 0; // velocity
let flightTime = 0;             // ms elapsed in flight
const FLIGHT_DURATION = 60000;  // 60 seconds to reach India
let birds = [];                 // obstacles to dodge
let birdTimer = 0;
let bumpShake = 0;              // visual feedback when hitting a bird

// ── CLOUDS ─────────────────────────────────────────────────
const clouds = [
  { x: 60,  y: 60,  w: 120, s: 0.3 },
  { x: 300, y: 40,  w: 90,  s: 0.2 },
  { x: 600, y: 80,  w: 150, s: 0.4 },
  { x: 750, y: 30,  w: 100, s: 0.25 }
];

// ── STARS (India scene) ────────────────────────────────────
const stars = Array.from({ length: 80 }, () => ({
  x: Math.random() * 900, y: Math.random() * 200,
  r: Math.random() * 1.5 + 0.5
}));

// ── KEYS ───────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'Enter' && state === 'start') startGame();
  if (e.key === 'Enter' && state === 'india') resetGame();
  if ((e.key === 'e' || e.key === 'E') && state === 'home') tryPress();
  if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function nearTub() {
  return Math.abs(player.x - (tub.x + tub.w / 2)) < 70 && player.y + player.h > tub.y;
}

function tryPress() {
  if (nearTub()) {
    btn.pressed = true;
    setTimeout(() => launchFlight(), 500);
  }
}

function startGame() {
  state = 'home';
  player.x = 100; player.y = GROUND - player.h;
  player.vx = 0; player.vy = 0; player.onGround = true;
  btn.pressed = false; flyProgress = 0;
}

function launchFlight() {
  state = 'flying';
  flyTubX = 200;
  flyTubY = 300;
  flyTubVX = 0; flyTubVY = 0;
  flyProgress = 0;
  flightTime = 0;
  birds = [];
  birdTimer = 0;
  bumpShake = 0;
}

function resetGame() {
  state = 'start';
}

// ── UPDATE ─────────────────────────────────────────────────
function update(dt) {
  if (state === 'home') updateHome(dt);
  if (state === 'flying') updateFlying(dt);

  // clouds drift
  clouds.forEach(c => { c.x -= c.s; if (c.x + c.w < 0) c.x = 920; });
}

function updateHome(dt) {
  // move
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.vx = -3; player.dir = -1; }
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.vx = 3; player.dir = 1; }
  else player.vx = 0;

  // jump
  if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && player.onGround) {
    player.vy = -12;
    player.onGround = false;
  }

  player.vy += 0.5;
  player.x += player.vx;
  player.y += player.vy;

  if (player.y + player.h >= GROUND) {
    player.y = GROUND - player.h;
    player.vy = 0;
    player.onGround = true;
  }
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  // animate walk frame
  if (player.vx !== 0) {
    player.frameTimer += dt;
    if (player.frameTimer > 180) { player.frame = (player.frame + 1) % 2; player.frameTimer = 0; }
  } else player.frame = 0;

  // hint
  if (nearTub()) hint.textContent = '[E] Knopf drücken';
  else hint.textContent = '← → Laufen  |  ↑ Springen  |  Zur Badewanne gehen';
}

function updateFlying(dt) {
  // Count flight time toward the ~60 second goal
  flightTime += dt;
  flyProgress = Math.clamp(flightTime / FLIGHT_DURATION, 0, 1);
  if (flyProgress >= 1) { state = 'india'; hint.textContent = ''; return; }

  // Player steers the tub with arrow keys / WASD
  const acc = 0.35;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) flyTubVX -= acc;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) flyTubVX += acc;
  if (keys['ArrowUp']    || keys['w'] || keys['W'] || keys[' ']) flyTubVY -= acc;
  if (keys['ArrowDown']  || keys['s'] || keys['S']) flyTubVY += acc;

  // Gentle drag so it feels floaty but controllable
  flyTubVX *= 0.94;
  flyTubVY *= 0.94;
  flyTubX += flyTubVX;
  flyTubY += flyTubVY;

  // Keep the tub on screen
  flyTubX = Math.clamp(flyTubX, 60, canvas.width - 60);
  flyTubY = Math.clamp(flyTubY, 60, canvas.height - 80);

  // Spawn birds to dodge (fly in from the right)
  birdTimer += dt;
  if (birdTimer > 1100) {
    birdTimer = 0;
    birds.push({
      x: canvas.width + 30,
      y: 80 + Math.random() * (canvas.height - 200),
      speed: 2 + Math.random() * 2.5,
      flap: 0
    });
  }
  for (const b of birds) {
    b.x -= b.speed;
    b.flap += dt * 0.01;
  }
  birds = birds.filter(b => b.x > -40);

  // Collision with birds → gentle bump (kid-friendly, no game over)
  for (const b of birds) {
    if (Math.abs(b.x - flyTubX) < 45 && Math.abs(b.y - flyTubY) < 40 && !b.hit) {
      b.hit = true;
      bumpShake = 12;
      flyTubVX -= 3; // pushed back a little
    }
  }
  if (bumpShake > 0) bumpShake -= dt * 0.05;
}

// ── DRAW ───────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (state === 'start') drawStart();
  else if (state === 'home') drawHome();
  else if (state === 'flying') drawFlying();
  else if (state === 'india') drawIndia();
}

function drawStart() {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#0f3460'); sky.addColorStop(1, '#16213e');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  ctx.fillStyle = 'white';
  stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y + 100, s.r, 0, Math.PI*2); ctx.fill(); });

  // Title
  ctx.save();
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 52px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('🛁 Nach Indien!', 450, 180);
  ctx.restore();

  ctx.fillStyle = '#e2e2e2';
  ctx.font = '22px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('Du fliegst mit deiner Badewanne nach Indien', 450, 240);

  ctx.fillStyle = '#ffd700';
  ctx.font = '18px Segoe UI';
  ctx.fillText('Laufen: ← →   |   Springen: ↑   |   Knopf: E', 450, 295);
  ctx.fillStyle = '#aee';
  ctx.font = '16px Segoe UI';
  ctx.fillText('Im Flug steuerst du die Badewanne selbst (~60 Sek.)!', 450, 325);

  drawBlinkText('[ ENTER ] Spiel starten', 450, 380, '#00d4ff');
}

let blinkTimer = 0;
function drawBlinkText(text, x, y, color) {
  if (Math.floor(blinkTimer / 600) % 2 === 0) {
    ctx.fillStyle = color;
    ctx.font = 'bold 24px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(text, x, y);
  }
}

function drawHome() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#87ceeb'); sky.addColorStop(1, '#d4f0ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, GROUND);

  // Sun
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(820, 70, 45, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,215,0,0.2)';
  ctx.beginPath(); ctx.arc(820, 70, 65, 0, Math.PI*2); ctx.fill();

  // Clouds
  clouds.forEach(c => drawCloud(c.x, c.y, c.w));

  // Ground
  const gr = ctx.createLinearGradient(0, GROUND, 0, canvas.height);
  gr.addColorStop(0, '#5a8a3c'); gr.addColorStop(1, '#3d6b25');
  ctx.fillStyle = gr; ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);

  // Path (stones)
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 ? '#c8a96e' : '#b8996e';
    ctx.fillRect(180 + i * 60, GROUND, 55, 15);
  }

  // House
  drawHouse(60, GROUND - 160);

  // Bathtub
  drawTub(tub.x, tub.y, btn.pressed);

  // Distance indicator
  const dist = Math.abs(player.x - (tub.x + tub.w / 2));
  if (dist < 200 && dist > 70) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '14px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('⟶ Badewanne', tub.x + tub.w / 2, tub.y - 30);
  }

  // Player
  drawPlayer(player.x, player.y, player.dir, player.frame);

  hint.textContent = nearTub()
    ? '[E] Knopf drücken — starte den Flug!'
    : '← → Laufen  |  ↑ Springen  |  Zur Badewanne gehen';
}

function drawFlying() {
  // Sky becomes more orange/sunset as we fly
  const t = flyProgress;
  const r = Math.round(lerp(135, 20, t));
  const g = Math.round(lerp(206, 10, t));
  const b = Math.round(lerp(235, 60, t));
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars appearing
  if (t > 0.5) {
    ctx.fillStyle = `rgba(255,255,255,${(t - 0.5) * 2})`;
    stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y + 20, s.r, 0, Math.PI*2); ctx.fill(); });
  }

  // Horizon glow
  const glow = ctx.createLinearGradient(0, 300, 0, canvas.height);
  glow.addColorStop(0, 'rgba(255,150,50,0)');
  glow.addColorStop(1, 'rgba(255,100,0,0.4)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Clouds
  clouds.forEach(c => drawCloud(c.x, c.y, c.w));

  // Earth below (shrinking)
  const earthH = Math.round(lerp(canvas.height * 0.45, 30, t));
  const landGrad = ctx.createLinearGradient(0, canvas.height - earthH, 0, canvas.height);
  landGrad.addColorStop(0, '#4a8c5c'); landGrad.addColorStop(1, '#2d5a3d');
  ctx.fillStyle = landGrad;
  ctx.fillRect(0, canvas.height - earthH, canvas.width, earthH);

  // Birds to dodge
  birds.forEach(b => drawBird(b.x, b.y, b.flap));

  // Progress bar + remaining time
  const secsLeft = Math.ceil((FLIGHT_DURATION - flightTime) / 1000);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(20, 20, 260, 16);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(20, 20, 260 * t, 16);
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5;
  ctx.strokeRect(20, 20, 260, 16);
  ctx.fillStyle = 'white'; ctx.font = '13px Segoe UI'; ctx.textAlign = 'left';
  ctx.fillText(`Flug nach Indien: ${Math.round(t * 100)}%  —  noch ${secsLeft}s`, 24, 53);

  // Tub + player flying (steered by player), with a little bump shake
  const shakeX = bumpShake > 0 ? (Math.sin(blinkTimer * 0.08) * bumpShake) : 0;
  const tiltAngle = Math.clamp(flyTubVX * 0.04, -0.35, 0.35);
  ctx.save();
  ctx.translate(flyTubX + shakeX, flyTubY);
  ctx.rotate(tiltAngle);
  drawTub(-45, -25, true);
  drawPlayer(-15, -70, 1, Math.floor(blinkTimer / 200) % 2);
  // Speed lines
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-60 - i * 20, -15 + i * 6);
    ctx.lineTo(-120 - i * 20, -15 + i * 6);
    ctx.stroke();
  }
  ctx.restore();

  hint.textContent = '✈ Steuere die Badewanne: ← → ↑ ↓  |  Weiche den Vögeln aus!';
}

function drawBird(x, y, flap) {
  ctx.strokeStyle = '#2c2c2c';
  ctx.lineWidth = 3;
  const wing = Math.sin(flap) * 8;
  ctx.beginPath();
  ctx.moveTo(x - 14, y + wing);
  ctx.quadraticCurveTo(x, y - 6, x, y);
  ctx.quadraticCurveTo(x, y - 6, x + 14, y + wing);
  ctx.stroke();
  // little body
  ctx.fillStyle = '#2c2c2c';
  ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
}

function drawIndia() {
  // Evening sky over India
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#1a0535'); sky.addColorStop(0.6, '#6b2d8b'); sky.addColorStop(1, '#ff6b35');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });

  // Taj Mahal silhouette
  drawTajMahal(450, GROUND - 10);

  // Ground (Indian soil - warm sandy)
  const gr = ctx.createLinearGradient(0, GROUND, 0, canvas.height);
  gr.addColorStop(0, '#c8a55a'); gr.addColorStop(1, '#a07840');
  ctx.fillStyle = gr; ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);

  // Flowers
  for (let i = 0; i < 6; i++) {
    drawFlower(100 + i * 130, GROUND - 10, ['#FF6B6B','#FFD700','#FF9FF3','#54A0FF'][i%4]);
  }

  // Indian people welcoming the player (traditional clothing)
  drawIndianWoman(120, GROUND - player.h, 1, '#e91e63', '#ffd700');  // pink sari
  drawIndianMan(200, GROUND - player.h, 1, '#ff9800', '#fff');        // orange kurta + turban
  drawIndianWoman(620, GROUND - player.h, -1, '#9c27b0', '#ff5722');  // purple sari
  drawIndianMan(720, GROUND - player.h, -1, '#4caf50', '#fff');       // green kurta + turban
  drawIndianWoman(800, GROUND - player.h, -1, '#00bcd4', '#ffd700');  // teal sari

  // Landed tub
  drawTub(380, GROUND - tub.h + 10, true);

  // Player standing next to tub
  drawPlayer(310, GROUND - player.h, -1, 0);

  // Banner
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(ctx, 130, 50, 640, 90, 15);
  ctx.fill();
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 38px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('🇮🇳 Willkommen in Indien! 🇮🇳', 450, 98);
  ctx.restore();
  ctx.fillStyle = '#ffe0b2';
  ctx.font = '20px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('Die Menschen in indischer Kleidung begrüßen dich! 🛁✨', 450, 165);

  drawBlinkText('[ ENTER ] Nochmal fliegen', 450, 210, '#00d4ff');

  hint.textContent = '[ ENTER ] Nochmal spielen';
}

// ── DRAW HELPERS ───────────────────────────────────────────
function drawHouse(x, y) {
  // Wall
  ctx.fillStyle = '#f5deb3';
  ctx.fillRect(x, y + 60, 160, 100);
  // Roof
  ctx.fillStyle = '#8b2500';
  ctx.beginPath(); ctx.moveTo(x - 15, y + 60); ctx.lineTo(x + 80, y); ctx.lineTo(x + 175, y + 60); ctx.closePath(); ctx.fill();
  // Door
  ctx.fillStyle = '#5c3317';
  ctx.fillRect(x + 55, y + 115, 40, 45);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(x + 91, y + 137, 4, 0, Math.PI*2); ctx.fill();
  // Window
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(x + 15, y + 80, 35, 30);
  ctx.strokeStyle = '#5c3317'; ctx.lineWidth = 2;
  ctx.strokeRect(x + 15, y + 80, 35, 30);
  ctx.beginPath(); ctx.moveTo(x + 32, y + 80); ctx.lineTo(x + 32, y + 110); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 15, y + 95); ctx.lineTo(x + 50, y + 95); ctx.stroke();
  // Window 2
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(x + 105, y + 80, 35, 30);
  ctx.strokeStyle = '#5c3317';
  ctx.strokeRect(x + 105, y + 80, 35, 30);
  ctx.beginPath(); ctx.moveTo(x + 122, y + 80); ctx.lineTo(x + 122, y + 110); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 105, y + 95); ctx.lineTo(x + 140, y + 95); ctx.stroke();
}

function drawTub(x, y, buttonPressed) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x + 45, y + 52, 48, 8, 0, 0, Math.PI*2); ctx.fill();
  // Tub body
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath();
  ctx.moveTo(x, y + 15); ctx.lineTo(x + 90, y + 15);
  ctx.lineTo(x + 85, y + 50); ctx.lineTo(x + 5, y + 50);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#b0b0c0'; ctx.lineWidth = 2;
  ctx.stroke();
  // Tub rim
  ctx.fillStyle = '#d0d0e0';
  ctx.fillRect(x, y + 10, 90, 10);
  ctx.strokeStyle = '#a0a0c0'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y + 10, 90, 10);
  // Water
  ctx.fillStyle = 'rgba(100,180,240,0.6)';
  ctx.fillRect(x + 5, y + 18, 80, 18);
  // Faucet
  ctx.fillStyle = '#c0c0c0';
  ctx.fillRect(x + 72, y + 5, 8, 16);
  ctx.fillRect(x + 68, y + 5, 16, 5);
  // Button
  ctx.fillStyle = buttonPressed ? '#ff4444' : '#00cc44';
  ctx.beginPath(); ctx.arc(x + 35, y + 6, 7, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = buttonPressed ? '#cc0000' : '#008800'; ctx.lineWidth = 1.5;
  ctx.stroke();
  // Button label
  ctx.fillStyle = 'white'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center';
  ctx.fillText(buttonPressed ? '!' : 'GO', x + 35, y + 9);
  // Legs
  ctx.fillStyle = '#c0c0c0';
  [[x + 10, y + 50], [x + 30, y + 50], [x + 55, y + 50], [x + 75, y + 50]].forEach(([lx, ly]) => {
    ctx.fillRect(lx, ly, 6, 12);
  });
}

function drawPlayer(x, y, dir, frame) {
  ctx.save();
  ctx.translate(x + 18, y);
  if (dir === -1) ctx.scale(-1, 1);

  // Body (shirt - colorful)
  ctx.fillStyle = '#3498db';
  ctx.fillRect(-12, 20, 24, 22);

  // Legs
  ctx.fillStyle = '#2c3e50';
  if (frame === 1) {
    ctx.fillRect(-10, 42, 10, 12); // left leg back
    ctx.fillRect(0, 42, 10, 8);   // right leg forward
  } else {
    ctx.fillRect(-10, 42, 10, 8);
    ctx.fillRect(0, 42, 10, 12);
  }

  // Shoes
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(-12, 50, 12, 4);
  ctx.fillRect(0, 46, 12, 4);

  // Arms
  ctx.fillStyle = '#f39c12';
  ctx.fillRect(-18, 22, 7, 16);
  ctx.fillRect(11, 22, 7, 16);

  // Head
  ctx.fillStyle = '#f5cba7';
  ctx.beginPath(); ctx.arc(0, 12, 14, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(-14, 0, 28, 10);
  ctx.beginPath(); ctx.arc(0, 0, 14, Math.PI, 0); ctx.fill();

  // Eyes
  ctx.fillStyle = '#2c3e50';
  ctx.beginPath(); ctx.arc(6, 12, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(7, 11, 1.2, 0, Math.PI*2); ctx.fill();

  // Smile
  ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 16, 6, 0.2, Math.PI - 0.2); ctx.stroke();

  ctx.restore();
}

// Indian woman in a sari with a bindi
function drawIndianWoman(x, y, dir, sariColor, borderColor) {
  ctx.save();
  ctx.translate(x + 18, y);
  if (dir === -1) ctx.scale(-1, 1);

  // Sari skirt (flared)
  ctx.fillStyle = sariColor;
  ctx.beginPath();
  ctx.moveTo(-12, 22);
  ctx.lineTo(12, 22);
  ctx.lineTo(18, 54);
  ctx.lineTo(-18, 54);
  ctx.closePath();
  ctx.fill();
  // Sari border (decorative bottom)
  ctx.fillStyle = borderColor;
  ctx.fillRect(-18, 50, 36, 4);
  // Sari drape over shoulder
  ctx.fillStyle = borderColor;
  ctx.beginPath();
  ctx.moveTo(-12, 20); ctx.lineTo(2, 20); ctx.lineTo(-4, 44); ctx.lineTo(-14, 44);
  ctx.closePath(); ctx.fill();

  // Arms
  ctx.fillStyle = '#c68642';
  ctx.fillRect(-17, 22, 6, 16);
  ctx.fillRect(11, 22, 6, 16);

  // Head
  ctx.fillStyle = '#c68642';
  ctx.beginPath(); ctx.arc(0, 12, 13, 0, Math.PI*2); ctx.fill();

  // Hair (bun)
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(0, 2, 13, Math.PI, 0); ctx.fill();
  ctx.fillRect(-13, 2, 26, 6);
  ctx.beginPath(); ctx.arc(-12, 12, 5, 0, Math.PI*2); ctx.fill(); // side bun

  // Bindi (forehead dot)
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.arc(0, 8, 2, 0, Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle = '#2c2c2c';
  ctx.beginPath(); ctx.arc(5, 13, 2.2, 0, Math.PI*2); ctx.fill();
  // Smile
  ctx.strokeStyle = '#a0392b'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(2, 16, 5, 0.2, Math.PI - 0.4); ctx.stroke();

  // Earrings
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(11, 16, 2, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

// Indian man in a kurta with a turban
function drawIndianMan(x, y, dir, kurtaColor, turbanColor) {
  ctx.save();
  ctx.translate(x + 18, y);
  if (dir === -1) ctx.scale(-1, 1);

  // Legs (dhoti / pants)
  ctx.fillStyle = '#f5f5dc';
  ctx.fillRect(-10, 42, 9, 12);
  ctx.fillRect(1, 42, 9, 12);

  // Kurta (long tunic)
  ctx.fillStyle = kurtaColor;
  ctx.beginPath();
  ctx.moveTo(-12, 20);
  ctx.lineTo(12, 20);
  ctx.lineTo(14, 46);
  ctx.lineTo(-14, 46);
  ctx.closePath();
  ctx.fill();
  // Kurta collar line
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, 34); ctx.stroke();

  // Arms
  ctx.fillStyle = kurtaColor;
  ctx.fillRect(-17, 22, 6, 18);
  ctx.fillRect(11, 22, 6, 18);
  // Hands
  ctx.fillStyle = '#a86b3a';
  ctx.fillRect(-17, 38, 6, 4);
  ctx.fillRect(11, 38, 6, 4);

  // Head
  ctx.fillStyle = '#a86b3a';
  ctx.beginPath(); ctx.arc(0, 12, 13, 0, Math.PI*2); ctx.fill();

  // Turban
  ctx.fillStyle = turbanColor;
  ctx.beginPath(); ctx.arc(0, 4, 14, Math.PI, 0); ctx.fill();
  ctx.fillRect(-14, 0, 28, 6);
  // Turban wrap lines
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-13, 2); ctx.quadraticCurveTo(0, -4, 13, 2); ctx.stroke();
  // Turban jewel
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle = '#2c2c2c';
  ctx.beginPath(); ctx.arc(5, 13, 2.2, 0, Math.PI*2); ctx.fill();
  // Moustache
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-2, 18); ctx.lineTo(8, 18); ctx.stroke();
  // Smile
  ctx.strokeStyle = '#7a2e1e'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(3, 19, 4, 0.2, Math.PI - 0.5); ctx.stroke();

  ctx.restore();
}

function drawCloud(x, y, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const h = w * 0.4;
  ctx.beginPath();
  ctx.arc(x + w * 0.3, y + h * 0.6, h * 0.7, 0, Math.PI*2);
  ctx.arc(x + w * 0.6, y + h * 0.4, h * 0.9, 0, Math.PI*2);
  ctx.arc(x + w * 0.85, y + h * 0.6, h * 0.65, 0, Math.PI*2);
  ctx.arc(x + w * 0.15, y + h * 0.65, h * 0.5, 0, Math.PI*2);
  ctx.fill();
}

function drawTajMahal(cx, y) {
  ctx.fillStyle = 'rgba(255,240,220,0.25)';
  // Main dome
  ctx.beginPath(); ctx.arc(cx, y - 100, 55, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 55, y - 100, 110, 100);
  // Dome top
  ctx.beginPath(); ctx.arc(cx, y - 150, 18, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 5, y - 165, 10, 15);
  // Side minarets
  [-200, -120, 120, 200].forEach(off => {
    ctx.fillRect(cx + off - 10, y - 130, 20, 130);
    ctx.beginPath(); ctx.arc(cx + off, y - 130, 10, Math.PI, 0); ctx.fill();
    ctx.fillRect(cx + off - 2, y - 142, 4, 12);
  });
  // Arch door
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.arc(cx, y - 40, 22, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 22, y - 40, 44, 40);
}

function drawFlower(x, y, color) {
  ctx.fillStyle = color;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.ellipse(x + Math.cos(i * Math.PI * 2 / 5) * 7, y - 8 + Math.sin(i * Math.PI * 2 / 5) * 7, 5, 5, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(x, y - 8, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a7c4e';
  ctx.fillRect(x - 1, y - 8, 2, 16);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function lerp(a, b, t) { return a + (b - a) * Math.clamp(t, 0, 1); }
Math.clamp = (v, min, max) => Math.min(Math.max(v, min), max);

// ── GAME LOOP ─────────────────────────────────────────────
let last = 0;
function loop(ts) {
  const dt = Math.min(ts - last, 50);
  last = ts;
  blinkTimer += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
